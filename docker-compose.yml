services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishnet-sentinel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - CORS_ORIGINS=*
    volumes:
      - phishnet-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/model-info"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  phishnet-data:
